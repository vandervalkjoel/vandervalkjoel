name: Generate streak cards

# Renders the streak card into the repo instead of hosting it. The upstream
# project is PHP, and putting PHP on Vercel means depending on a community
# runtime, so this sidesteps hosting entirely: the SVG is generated here and
# served from the repo by GitHub's own CDN.

on:
  schedule:
    # Twice daily. GitHub caches README images through its Camo proxy anyway,
    # so anything more frequent would not show up faster.
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs committing the same two SVGs will race each other into a rejected
# push. Queue them instead of cancelling, so a scheduled run is never dropped.
concurrency:
  group: streak-cards
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two themes so the README can serve each via <picture> and match the
      # viewer's colour scheme. exclude_days stops weekends from breaking a
      # streak; it does not change the contribution total.
      #
      # Colours are set explicitly rather than using the built-in themes, whose
      # orange-on-#151515 clashed with the other two cards. All three cards and
      # the banner share one teal accent taken from the avatar (3DDBB8 dark,
      # 0E9F87 light) on GitHub's own page backgrounds, so they read as one set.
      - name: Generate dark card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: >-
            user=vandervalkjoel&exclude_days=Sun,Sat&hide_border=true&background=0D1117&border=0D1117&stroke=30363D&ring=3DDBB8&fire=3DDBB8&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=3DDBB8&sideLabels=C9D1D9&dates=8B949E&excludeDaysLabel=8B949E
          path: profile/streak-dark.svg

      - name: Generate light card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: >-
            user=vandervalkjoel&exclude_days=Sun,Sat&hide_border=true&background=FFFFFF&border=FFFFFF&stroke=D0D7DE&ring=0E9F87&fire=0E9F87&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=0E9F87&sideLabels=1F2328&dates=59636E&excludeDaysLabel=59636E
          path: profile/streak-light.svg

      # Fail before committing. A card that reads zero is still valid SVG, so
      # without this the workflow would happily publish a broken card.
      - name: Verify the cards contain real numbers
        run: bash scripts/verify-cards.sh local

      - name: Commit if changed
        run: |
          # Authored by the bot on purpose: commits from this workflow must not
          # inflate the contribution stats the cards are reporting.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          if git diff --quiet --cached; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi

          git commit -m "Update streak cards"

          # A push straight after commit is rejected whenever main moved while
          # this job ran, which is easy to trigger by editing the repo at the
          # same time. Rebase and retry rather than failing the run and leaving
          # the cards stale.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto origin/main."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed, giving up rather than forcing." >&2
              exit 1
            }
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
